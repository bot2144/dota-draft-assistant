name: Build Windows installer

# Runs on a real, free GitHub-hosted Windows machine — produces a genuine
# native .msi and .exe (NSIS) installer without needing Rust, Visual Studio
# Build Tools, or anything else installed on your own computer.
#
# Trigger it either by pushing to main, or manually from the Actions tab
# ("Run workflow" button) — see the README section this workflow ships with.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installers
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
